stages:
  - validate
  - build

default:
  tags:
    - macos

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

variables:
  DOCKER_REGISTRY: "$CI_REGISTRY"
  BASE_IMAGE_NAME: "$CI_REGISTRY/$CI_PROJECT_PATH"
  API_IMAGE_NAME: "$BASE_IMAGE_NAME/api"
  SERVER_IMAGE_NAME: "$BASE_IMAGE_NAME/server"
  DOCKER_TAG: "latest"
  DOCKER_PLATFORM: "linux/amd64"
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  BACKEND_PATH: "backend/"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .docker/cache

frontend_check:
  stage: validate
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - "echo \"=== Step 1: Frontend Check (Type-check, Unit tests, Build) ===\""
    - cd frontend
    - npm ci
    - npm run type-check
    - npm run test:unit -- --run --maxWorkers=1
    - npm run build
backend_test:
  stage: validate
  image: composer:2
  services:
    - name: postgres:17-alpine
      alias: postgres
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    # Throwaway service credentials; phpunit.xml forces DB_DATABASE=booking_test, CI only points DB_HOST at the service.
    POSTGRES_DB: booking_test
    POSTGRES_USER: booking
    POSTGRES_PASSWORD: booking
    DB_HOST: postgres
    DB_USERNAME: booking
    DB_PASSWORD: booking
    COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"
  cache:
    key:
      files:
        - backend/composer.lock
    paths:
      - .composer-cache/
  script:
    - "echo \"=== Backend Test (full PHPUnit suite on PostgreSQL) ===\""
    - install-php-extensions pdo_pgsql gd
    - cd backend
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist
    - php artisan key:generate
    - vendor/bin/phpunit
build_and_deploy:
  stage: build
  image: docker:latest
  timeout: 10m
  needs:
    - frontend_check
    - backend_test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main")'
      when: manual
  before_script:
    - apk add --no-cache curl jq
    - mkdir -p .docker/cache
  script:
    - "echo \"=== Step 3: Building and Pushing Docker Images ===\""
    - "echo \"${DEPLOY_PASSWORD:-$CI_REGISTRY_PASSWORD}\" | docker login -u \"${DEPLOY_USERNAME:-$CI_REGISTRY_USER}\" --password-stdin \"$DOCKER_REGISTRY\""
    - |
      docker build \
        --platform="$DOCKER_PLATFORM" \
        -f "$BACKEND_PATH/Dockerfile" \
        --cache-from="$API_IMAGE_NAME:$DOCKER_TAG" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -t "$API_IMAGE_NAME:$DOCKER_TAG" \
        -t "$API_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        "$BACKEND_PATH"
    - docker push "$API_IMAGE_NAME:$DOCKER_TAG"
    - docker push "$API_IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - |
      docker build \
        --platform="$DOCKER_PLATFORM" \
        --build-arg API_IMAGE="$API_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        --build-arg APP_REVISION="$CI_COMMIT_SHA" \
        --build-arg FEATURE_DIRECT_OWNER_PAYMENTS=true \
        --build-arg FEATURE_TENANT_POS_WALLET=true \
        --build-arg FEATURE_SOCIAL_TOURNAMENTS=true \
        --build-arg FEATURE_MARKETPLACE_SPLIT_PAYMENTS=true \
        --build-arg FEATURE_MARKETPLACE_SLOT_RESALE=true \
        --build-arg PILOT_ORGANIZATION_IDS=73,74 \
        --cache-from="$SERVER_IMAGE_NAME:$DOCKER_TAG" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        -f devops/build/booking.prod.Dockerfile \
        -t "$SERVER_IMAGE_NAME:$DOCKER_TAG" \
        -t "$SERVER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA" \
        .
    - docker push "$SERVER_IMAGE_NAME:$DOCKER_TAG"
    - docker push "$SERVER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "${PORTAINER_WEBHOOK_URLS:-}" ] && [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "=== Step 4: Deploying booking images to Portainer ==="
        for item in $(echo "$PORTAINER_WEBHOOK_URLS" | jq -r '.[]'); do
          echo "Triggering configured Portainer deployment"
          curl -fsS --connect-timeout 10 --max-time 30 -X POST "$item" || echo "Warning: Portainer webhook endpoint returned error, deployment may require manual trigger once server is reachable."
        done
      fi
