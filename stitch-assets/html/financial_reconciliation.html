<!DOCTYPE html>
<html lang="vi">
<head>

        <div class="w-10 h-10 rounded-xl bg-[#78555e] flex items-center justify-center text-white">

      <div class="flex justify-between items-center">
        <div>
          <h1 class="text-2xl font-bold text-[#191c1d]">⚖️ Đối Soát Tài Chính & Cảnh Báo Thông Minh</h1>
          <p class="text-sm text-[#5d5f5f]">Hệ thống đối soát 3 chiều tự động giữa Sổ cái nội bộ Aura, Cổng PSP và Tài khoản quyết toán ngân hàng.</p>
