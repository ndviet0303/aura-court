frontend_check:
  image: node:24-bookworm
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - cd frontend
    - npm ci
    - npm run type-check
    - npm run test:unit -- --run
    - npm run build
