name: booking_app

x-booking-runtime-environment: &booking-runtime-environment
  APP_KEY: ${APP_KEY}
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL}
  FRONTEND_URL: ${FRONTEND_URL:-https://court.ziet.dev}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://court.ziet.dev}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-court.ziet.dev}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-.ziet.dev}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-none}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_DATABASE: ${DB_DATABASE}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  CACHE_STORE: ${CACHE_STORE:-redis}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_URL: ${REDIS_URL}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
  REDIS_QUEUE: ${REDIS_QUEUE:-default}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-payos}
  PAYOS_BASE_URL: ${PAYOS_BASE_URL:-https://api-merchant.payos.vn}
  PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
  PAYOS_API_KEY: ${PAYOS_API_KEY}
  PAYOS_WEBHOOK_SECRET: ${PAYOS_WEBHOOK_SECRET}
  PAYMENT_PROVIDER_FEE_BPS: ${PAYMENT_PROVIDER_FEE_BPS:-0}
  MINIMUM_PAYOUT_AMOUNT: ${MINIMUM_PAYOUT_AMOUNT:-500000}
  SETTLEMENT_DELAY_DAYS: ${SETTLEMENT_DELAY_DAYS:-2}
  FEATURE_MARKETPLACE_PAYOUTS: ${FEATURE_MARKETPLACE_PAYOUTS:-false}
  PILOT_ORGANIZATION_IDS: ${PILOT_ORGANIZATION_IDS}
  OBSERVABILITY_LOG_CHANNEL: ${OBSERVABILITY_LOG_CHANNEL:-structured}
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Aura Court}
  SEPAY_ENABLED: ${SEPAY_ENABLED:-true}
  SEPAY_BANK: ${SEPAY_BANK:-VCB}
  SEPAY_ACCOUNT: ${SEPAY_ACCOUNT}
  SEPAY_API_KEY: ${SEPAY_API_KEY}
  SEPAY_HMAC_SECRET: ${SEPAY_HMAC_SECRET}

services:
  court-server:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: court-server
    restart: unless-stopped
    environment: *booking-runtime-environment
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - booking_caddy_data:/data
      - booking_caddy_config:/config
    networks:
      - production

  booking-queue:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: booking-queue
    restart: unless-stopped
    working_dir: /app/booking-api
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment: *booking-runtime-environment
    healthcheck:
      disable: true
    networks:
      - production

  booking-scheduler:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: booking-scheduler
    restart: unless-stopped
    working_dir: /app/booking-api
    command: php artisan schedule:work
    environment: *booking-runtime-environment
    healthcheck:
      disable: true
    networks:
      - production

  booking-realtime:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: booking-realtime
    restart: unless-stopped
    working_dir: /app/booking-api
    command: php artisan realtime:work
    environment: *booking-runtime-environment
    healthcheck:
      disable: true
    networks:
      - production

volumes:
  booking_caddy_data:
  booking_caddy_config:

networks:
  production:
    external: true
