name: booking_app

services:
  court-server:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: court-server
    restart: unless-stopped
    env_file:
      - ./booking-api.prod.env
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - booking_caddy_data:/data
      - booking_caddy_config:/config
    networks:
      - production

  booking-queue:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: booking-queue
    restart: unless-stopped
    env_file:
      - ./booking-api.prod.env
    working_dir: /app/booking-api
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    healthcheck:
      disable: true
    networks:
      - production

  booking-scheduler:
    image: registry.gitlab.com/bantool/ziet-projects/booking/server:latest
    container_name: booking-scheduler
    restart: unless-stopped
    env_file:
      - ./booking-api.prod.env
    working_dir: /app/booking-api
    command: php artisan schedule:work
    healthcheck:
      disable: true
    networks:
      - production

volumes:
  booking_caddy_data:
  booking_caddy_config:

networks:
  production:
    external: true
